<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>NIKKE</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; background: #141b29 center / cover no-repeat; }
      * { -webkit-user-drag: none; }
      canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
      #c { opacity: 0; transition: opacity 0.5s; }
      #c.in { opacity: 1; }
      #zones, #hud { pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <canvas id="hud"></canvas>
    <canvas id="zones"></canvas>
    <script src="player.js"></script>
  </body>
</html>
