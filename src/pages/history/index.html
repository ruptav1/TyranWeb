<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' tyran:; script-src 'self' tyran:; style-src 'self' tyran: 'unsafe-inline'; img-src * data: blob: tyran:; connect-src 'self' tyran:" />
    <title>Lịch sử</title>
    <link rel="icon" href="tyran://shared/logo.svg" />
    <link rel="stylesheet" href="tyran://shared/base.css" />
    <link rel="stylesheet" href="tyran://shared/page.css" />
    <link rel="stylesheet" href="tyran://shared/listpage.css" />
    <script type="module" src="history.js"></script>
    <style>
      /* Nhóm tab: a window's tabs when it closed, reopened whole (history.js) */
      .single-head .seg { margin-left: 14px; }
      .group-icons { display: flex; flex: none; gap: 3px; max-width: 190px; overflow: hidden; }
      .group-icons img, .group-icons .favicon, .group-icons .fav-letter { flex: none; }
      .group-tabs { display: flex; flex-direction: column; margin: 0 0 8px 64px; border-left: 2px solid var(--line); }
      .group-tabs .list-item { padding-left: 12px; }
      .group-tabs[hidden] { display: none; }
      .group-row { cursor: pointer; }
      /* Đã quét: files scanned (filescan.js); red a virus found, yellow a risk, nothing found as any row */
      .scan-row { cursor: pointer; }
      .scan-ico { display: grid; flex: none; place-items: center; width: 34px; height: 34px; border-radius: 10px; background: var(--hover); color: var(--text-2); }
      .scan-ico img { width: 28px; height: 28px; }
      .scan-row.lv-bad { background: rgba(214, 69, 69, 0.11); }
      .scan-row.lv-bad:hover { background: rgba(214, 69, 69, 0.18); }
      .scan-row.lv-bad .li-sub, .scan-row.lv-bad .scan-ico { color: #d64545; }
      .scan-row.lv-warn { background: rgba(230, 170, 30, 0.13); }
      .scan-row.lv-warn:hover { background: rgba(230, 170, 30, 0.2); }
      .scan-row.lv-warn .li-sub, .scan-row.lv-warn .scan-ico { color: #b7860b; }
    </style>
  </head>
  <body>
    <main class="single">
      <header class="single-head">
        <img src="tyran://shared/logo.svg" alt="" />
        <h1 class="page-title">Lịch sử</h1>
        <div class="seg" id="mode"><button type="button" data-mode="pages">Trang web</button><button type="button" data-mode="groups">Nhóm tab</button><button type="button" data-mode="scans">Đã quét</button></div>
        <span class="grow"></span>
        <select id="range">
          <option value="3600000">1 giờ qua</option>
          <option value="86400000">24 giờ qua</option>
          <option value="604800000">7 ngày qua</option>
          <option value="0">Toàn bộ thời gian</option>
        </select>
        <button class="btn" id="clear"><span data-icon="trash" data-size="15"></span><span>Xóa lịch sử</span></button>
      </header>
      <input id="q" class="input search-big" type="search" placeholder="Tìm trong lịch sử…" />
      <div id="list" class="list"></div>
      <div id="more" class="faint center-note"></div>
    </main>
  </body>
</html>
